# Parâmetros do pipeline (versionados pelo DVC: alterar um valor aqui faz o
# `dvc repro` reexecutar os estágios que dependem dele).
# Caminhos relativos são resolvidos a partir da raiz do projeto.

random_state: 42

data:
  raw_path: data/raw/online_shoppers_intention.csv
  processed_dir: data/processed
  test_size: 0.2

train:
  cv_splits: 5
  n_iter: 30
  n_jobs: -1
  scoring: average_precision
  param_distributions:
    rf__n_estimators: [200, 300, 500, 800]
    rf__max_depth: [null, 8, 12, 16, 24]
    rf__min_samples_split: [2, 5, 10, 20]
    rf__min_samples_leaf: [1, 2, 4, 8]
    rf__max_features: [sqrt, log2, 0.3, 0.5]
  model_path: models/rf_online_shoppers.joblib
  metrics_path: reports/metrics.json
